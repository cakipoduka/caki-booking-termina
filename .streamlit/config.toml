# ============================================================================
# CAKI tema — kopirati kao:  caki-booking-termina/.streamlit/config.toml
# Zamjenjuje postojeću datoteku (stara ima 3 retka, samo showSidebarNavigation).
# ============================================================================
# Mijenja SAMO izgled (boje, podlogu, font). Ne dira podatke ni logiku.
# Povratak na staro: Discard u GitHub Desktopu ili git checkout te datoteke.
#
# ŠTO TEMA NE MOŽE (radi caki_stil.py): Inter, sjene, zaobljenja, raspored gumba.

[theme]
# 3.11.2026. (Claude, redizajn): iste boje kao CRM admin (caki-upisi-crm-main) — font IBM Plex Sans dolazi iz caki_tema.py
primaryColor = "#1d64b8"
backgroundColor = "#f4f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b2230"
font = "sans serif"
borderColor = "#d3d8df"
showWidgetBorder = true
baseRadius = "8px"

[client]
# Portal je JEDNA stranica s karticama — bez Streamlitovog izbornika stranica.
# OVO NE DIRATI: postavka već postoji u staroj datoteci i mora ostati.
showSidebarNavigation = false
